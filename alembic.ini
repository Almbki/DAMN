# Alembic configuration file.
# The database URL is intentionally NOT hardcoded here: alembic/env.py reads it
# from the application settings (DATABASE_URL) via app.core.config.get_settings().

[alembic]
script_location = alembic
prepend_sys_path = .
# File naming: 1234_short_slug.py
file_template = %%(rev)s_%%(slug)s
# 'timezone' for the migration timestamp:
timezone = utc
path_separator = os
# Truncate revision hashes to 8 chars
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S